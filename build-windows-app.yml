
name: Build Windows Application

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'build-windows.yml'
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app
          Get-ChildItem -Force | Where-Object {
            $_.Name -notin @('.git', '.github', 'app')
          } | Copy-Item -Destination app -Recurse -Force

          Set-Location app

          @'
          {
            "name": "gestion-scolaire-deo-vumilia",
            "version": "1.0.0",
            "description": "Gestion Scolaire Deo Vumilia",
            "main": "main.js",
            "scripts": {
              "build": "electron-builder --win portable"
            },
            "devDependencies": {
              "electron": "^35.0.0",
              "electron-builder": "^26.0.0"
            },
            "build": {
              "appId": "com.deovumilia.gestion",
              "productName": "Gestion Scolaire Deo Vumilia",
              "win": {
                "target": "portable"
              },
              "files": [
                "**/*",
                "!node_modules/.cache/**"
              ]
            }
          }
          '@ | Set-Content package.json -Encoding UTF8

          @'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1200,
              height: 800,
              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false
              }
            });

            win.loadFile(path.join(__dirname, 'index.html'));
          }

          app.whenReady().then(createWindow);
          '@ | Set-Content main.js -Encoding UTF8

          npm install

      - name: Build Windows EXE
        working-directory: app
        run: npm run build

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Scolaire-Windows
          path: app/dist/*.exe
          if-no-files-found: error
