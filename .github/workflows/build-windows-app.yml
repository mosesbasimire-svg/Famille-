
name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-windows-app.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get application source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app

          Get-ChildItem -Force | Where-Object {
            $_.Name -notin @('.git', '.github', 'app', 'node_modules')
          } | Copy-Item -Destination app -Recurse -Force

          Set-Location app

          @'
          {
            "name": "gestion-scolaire-deo-vumilia",
            "version": "1.0.0",
            "description": "Gestion Scolaire Deo Vumilia",
            "main": "main.js",
            "scripts": {
              "build": "electron-builder --win nsis"
            },
            "devDependencies": {
              "electron": "22.3.27",
              "electron-builder": "24.13.3"
            },
            "build": {
              "appId": "com.deovumilia.gestion",
              "productName": "Gestion Scolaire Deo Vumilia",
              "directories": {
                "buildResources": "build"
              },
              "files": [
                "**/*",
                "!node_modules/.cache/**"
              ],
              "win": {
                "target": "nsis"
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true,
                "shortcutName": "Gestion Scolaire Deo Vumilia"
              }
            }
          }
          '@ | Set-Content package.json -Encoding UTF8

          @'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1200,
              height: 800,
              minWidth: 800,
              minHeight: 600,
              autoHideMenuBar: true,
              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false
              }
            });

            win.loadFile(path.join(__dirname, 'index.html'));
          }

          app.whenReady().then(() => {
            createWindow();

            app.on('activate', () => {
              if (BrowserWindow.getAllWindows().length === 0) {
                createWindow();
              }
            });
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') {
              app.quit();
            }
          });
          '@ | Set-Content main.js -Encoding UTF8

          npm install

      - name: Build Windows installer
        working-directory: app
        run: npm run build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Scolaire-Installateur-Windows
          path: app/dist/* Setup *.exe
          if-no-files-found: error
          retention-days: 7
